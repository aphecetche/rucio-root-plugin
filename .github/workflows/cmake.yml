name: CMake

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        preset: [dev, release]
        stack:
          - { root: '6.32.0', xrootd: '5.6.9' }
          - { root: '6.38.04', xrootd: '5.9.2' }
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up ROOT ${{ matrix.stack.root }} and XRootD ${{ matrix.stack.xrootd }}
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: rucio-root-plugin
          create-args: >-
            cxx-compiler
            cmake
            make
            nlohmann_json
            root=${{ matrix.stack.root }}
            xrootd=${{ matrix.stack.xrootd }}
          cache-environment: true

      - name: Build ${{ matrix.preset }} preset
        run: cmake --workflow --preset "${{ matrix.preset }}"

      - name: Test ${{ matrix.preset }} preset
        run: ctest --preset "${{ matrix.preset }}"
